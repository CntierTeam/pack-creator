display_name: pack-creator
short_description: Use pack-creator — build.pk authoring, override lang, zip export
default_prompt: >-
  Follow the pack-creator skill for using the pack-creator binary on pack
  projects (not for developing PackCreator itself). Prefer pack-creator
  new/check/build; keep build.pk + src/main; put config in build.pk; use
  override{} for client translation keys; WHOLE mappings on pack export.
